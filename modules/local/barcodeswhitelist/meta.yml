# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "barcodeswhitelist"
description: Strip the sample_id column from the BRB-seq barcodes TSV to
  produce a plain STARsolo cell-barcode whitelist
keywords:
  - barcode
  - whitelist
  - starsolo
tools:
  - "gawk":
      description: "GNU awk"
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/gawk.html"
      licence:
        - "GPL-3.0-or-later"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - barcodes_tsv:
        type: file
        description: Tab-separated file with header columns `sample_id` and
          `barcode`
        pattern: "*.tsv"

output:
  whitelist:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.whitelist.txt":
          type: file
          description: Header-less, one-barcode-per-line file suitable for
            STARsolo's `--soloCBwhitelist`
          pattern: "*.whitelist.txt"
authors:
  - "@Schmytzi"
maintainers:
  - "@Schmytzi"
