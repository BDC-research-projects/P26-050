# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# # TODO nf-core: Add a description of the module and list keywords
name: "convertmatrix"
description: write your description here
keywords:
  - sort
  - example
  - genomics
tools:
  ## TODO nf-core: Add a description and other details for the software below
  - "convertmatrix":
      description: ""
      homepage: ""
      documentation: ""
      tool_dev_url: ""
      doi: ""
      licence: null
      identifier: null

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bamdir:
        type: directory
        description: STARsolo `*.Solo.out` directory containing the raw
          barcode x gene count matrices
    - barcodes_tsv:
        type: file
        description: Tab-separated file with header columns `sample_id` and
          `barcode`, mapping each multiplexed cell barcode to a biological
          sample name
        pattern: "*.tsv"

output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.tsv":
          type: file
          description: |
            Feature x sample UMI/read count matrices (`*.umi_counts.tsv` and
            `*.read_counts.tsv`). Columns are labelled with the sample names
            from `barcodes_tsv` rather than raw cell barcodes.
          pattern: "*.tsv"
  versions_convertmatrix:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "convertmatrix":
          type: string
          description: The name of the tool
      - "convertmatrix --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - convertmatrix:
          type: string
          description: The name of the tool
      - convertmatrix --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Schmytzi"
maintainers:
  - "@Schmytzi"
